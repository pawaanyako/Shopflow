services:
  catalog-api:
    build: ./src/Services/Catalog
    container_name: shopflow-catalog-api
    environment:
      - ConnectionStrings__CatalogDb=Host=catalog-db;Port=5432;Username=catalog;Password=catalog_pass;Database=catalog_db
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    depends_on:
      catalog-db:
        condition: service_healthy

  catalog-db:
    image: postgres:17-alpine
    container_name: shopflow-catalog-db
    environment:
      - POSTGRES_USER=catalog
      - POSTGRES_PASSWORD=catalog_pass
      - POSTGRES_DB=catalog_db
    ports:
      - "5432:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  catalog_pgdata: